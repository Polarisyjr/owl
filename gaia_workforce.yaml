name: gaia_workforce

# Global ChatAgent.memory trim threshold. Should sit a few k below the
# vLLM endpoint's max_model_len so vLLM has room to generate output
# without hitting BadRequest. Per-role override goes under `roles.<role>.token_limit`.
token_limit: 120000

# Per-role vLLM endpoint + GPU assignment for the GAIA workforce.
# Each role gets `port` and `gpus`. Roles sharing the same `port` point at
# the same vLLM server (e.g. browser_planning piggybacks on web's endpoint).
# Model name is auto-discovered from the server's /v1/models endpoint, so
# it isn't listed here.
#
# whisper is local faster-whisper (in-process), not a vLLM server — only
# needs a GPU pin via the top-level `whisper_gpu` field.

roles:
  # Workforce orchestrators
  coordinator:      { port: 8000, gpus: [0] }
  task:             { port: 8001, gpus: [1] }
  answerer:         { port: 8002, gpus: [2] }

  # Primary worker agents
  web:              { port: 8003, gpus: [3] }
  document:         { port: 8004, gpus: [4] }
  reasoning:        { port: 8005, gpus: [5] }

  # Toolkit-internal text sub-agents — share a primary text endpoint
  browser_planning: { port: 8003, gpus: [3] }   # share with web
  audio:            { port: 8004, gpus: [4] }   # share with document

  # Multimodal endpoint — image / video / browser_web all share one VL server
  # Browser observations should produce one compact JSON action. In the C8
  # source run, all 87 completed calls used <=273 output tokens; cap runaway
  # generations while retaining generous headroom for unusual actions.
  browser_web:
    port: 8006
    gpus: [6]
    extra_config:
      max_tokens: 4096
  # All VL roles need an explicit output ceiling. Without one, a missed EOS can
  # decode until the 131k model context or the client timeout and pin a
  # steady-concurrency lane for the rest of the measurement window.
  image:
    port: 8006
    gpus: [6]
    extra_config:
      max_tokens: 4096
  video:
    port: 8006
    gpus: [6]
    extra_config:
      max_tokens: 4096

# Local faster-whisper STT — pinned GPU index. The flex script builds ONE
# shared WhisperModel on this GPU and injects it into every
# AudioAnalysisToolkit so all workers reuse the same instance. Omit to fall
# back to faster-whisper's default (cuda:0).
whisper_gpu: 7

launch:
  # Start vLLM servers separately (placeholder commands — adjust to your setup).
  start_cmd: "bash scripts/gaia/start_vllm.sh"
  stop_cmd: |
    for s in $(tmux ls 2>/dev/null | awk -F: '/^gaia-/ {print $1}'); do
      tmux kill-session -t "$s" || true
    done

scrape:
  gpu_interval_s: 1.0
  engine_interval_s: 1.0
