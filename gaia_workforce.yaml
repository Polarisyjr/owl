name: gaia_workforce

# role → port (vLLM /metrics) + gpus (nvidia-smi attribution).
# port=null means non-LLM tool (whisper): GPU-side metrics only, no engine scrape.
#
# Roles must use the exact names the workforce code calls `make_model(role)` with:
#   text orchestrators : coordinator, task, answerer
#   text worker agents : web, document, reasoning
#   text toolkit-internal: audio, browser_planning
#   VL toolkit-internal  : image, video, browser_web   (require a vision-capable model)
#   non-vLLM             : whisper                     (faster-whisper, local STT)
#
# Roles sharing the same `port` (and therefore same `gpus`) point at the
# same vLLM server — that's how you collapse e.g. image/video/browser_web
# onto one VL endpoint, or a couple of text roles onto one text endpoint.
# Any role NOT listed here falls back to `default`.

roles:
  # ── text endpoints ────────────────────────────────────────────────────────
  default:        { port: 8000, gpus: [0] }   # catch-all for unlisted text roles
  coordinator:    { port: 8001, gpus: [1] }
  task:           { port: 8002, gpus: [2] }
  answerer:       { port: 8003, gpus: [3] }
  web:            { port: 8004, gpus: [4] }
  document:       { port: 8005, gpus: [5] }
  reasoning:      { port: 8006, gpus: [6] }
  # text sub-agents that piggyback on existing text endpoints
  audio:            { port: 8004, gpus: [4] }   # share with web
  browser_planning: { port: 8004, gpus: [4] }   # share with web

  # ── VL endpoint (image / video / browser_web all share one VL server) ────
  image:          { port: 8007, gpus: [7] }
  video:          { port: 8007, gpus: [7] }
  browser_web:    { port: 8007, gpus: [7] }

  # ── non-vLLM: faster-whisper local STT ───────────────────────────────────
  # The flex script reads gpus[0] and passes (gpus[0] + worker_id) to
  # AudioAnalysisToolkit(whisper_device_index=...). Omit this entry to let
  # faster-whisper use its default (cuda:0).
  whisper:        { port: null, gpus: [7] }

launch:
  # Start vLLM servers separately (e.g. tmux script). Placeholder commands —
  # adjust to your setup.
  start_cmd: "bash scripts/gaia/start_vllm.sh"
  stop_cmd: |
    for s in $(tmux ls 2>/dev/null | awk -F: '/^gaia-/ {print $1}'); do
      tmux kill-session -t "$s" || true
    done

scrape:
  gpu_interval_s: 1.0
  engine_interval_s: 1.0
