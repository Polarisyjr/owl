name: gaia_workforce_owl-h1

# HARVEST floor: all 6 text roles on ONE TP1 endpoint. 1 text GPU, 5 cards freed.
# GENERATED by the gpu-harvesting study. Only `port` is read by the flex
# script; `gpus` is informational. Derived from gaia_workforce.yaml —
# same token_limit, same VL max_tokens caps, same whisper pin.

token_limit: 120000

roles:
  coordinator:       { port: 8000, gpus: [0] }
  task:              { port: 8000, gpus: [0] }
  answerer:          { port: 8000, gpus: [0] }
  web:               { port: 8000, gpus: [0] }
  document:          { port: 8000, gpus: [0] }
  reasoning:         { port: 8000, gpus: [0] }
  browser_planning:  { port: 8000, gpus: [0] }
  audio:             { port: 8000, gpus: [0] }

  browser_web:
    port: 8001
    gpus: [1]
    extra_config:
      max_tokens: 4096
  image:
    port: 8001
    gpus: [1]
    extra_config:
      max_tokens: 4096
  video:
    port: 8001
    gpus: [1]
    extra_config:
      max_tokens: 4096

whisper_gpu: 7

launch:
  start_cmd: "bash scripts/gaia/start_vllm.sh"
  stop_cmd: |
    for s in $(tmux ls 2>/dev/null | awk -F: '/^gaia-/ {print $1}'); do
      tmux kill-session -t "$s" || true
    done

scrape:
  gpu_interval_s: 1.0
  engine_interval_s: 1.0
