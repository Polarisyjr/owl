name: gaia_workforce_owl-h2b

# HARVEST: same 4 text GPUs as owl-h4 but as 2xTP2 replicas. Isolates TP-vs-replica at equal GPU count.
# GENERATED by the gpu-harvesting study. Only `port` is read by the flex
# script; `gpus` is informational. Derived from gaia_workforce.yaml —
# same token_limit, same VL max_tokens caps, same whisper pin.

token_limit: 120000

roles:
  coordinator:       { port: 8001, gpus: [2, 3] }
  task:              { port: 8001, gpus: [2, 3] }
  answerer:          { port: 8000, gpus: [0, 1] }
  web:               { port: 8000, gpus: [0, 1] }
  document:          { port: 8001, gpus: [2, 3] }
  reasoning:         { port: 8001, gpus: [2, 3] }
  browser_planning:  { port: 8000, gpus: [0, 1] }
  audio:             { port: 8001, gpus: [2, 3] }

  browser_web:
    port: 8002
    gpus: [4]
    extra_config:
      max_tokens: 4096
  image:
    port: 8002
    gpus: [4]
    extra_config:
      max_tokens: 4096
  video:
    port: 8002
    gpus: [4]
    extra_config:
      max_tokens: 4096

whisper_gpu: 7

launch:
  start_cmd: "bash scripts/gaia/start_vllm.sh"
  stop_cmd: |
    for s in $(tmux ls 2>/dev/null | awk -F: '/^gaia-/ {print $1}'); do
      tmux kill-session -t "$s" || true
    done

scrape:
  gpu_interval_s: 1.0
  engine_interval_s: 1.0
